version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
  - package-ecosystem: gomod
    directories:
      - /services/api
      - /services/scheduler
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore
  - package-ecosystem: bun
    directory: /apps/mobile
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore
    # The Expo SDK pins these to versions built and tested together. Upgrade
    # them with `bunx expo install --fix` as part of an SDK upgrade instead.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@types/react"
      - dependency-name: "typescript"
  - package-ecosystem: bun
    directory: /docs
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore
  # The builder image is pinned by digest. Dependabot proposes a new digest
  # when the tag moves, so the image cannot change between builds unreviewed.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
