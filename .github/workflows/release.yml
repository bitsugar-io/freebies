name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: |
            services/api/go.sum
            services/scheduler/go.sum
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just test
      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: latest
          args: --current --strip header
        env:
          OUTPUT: ${{ runner.temp }}/freebies-changes.md
      # Notes only: the API ships as a container image (see the ops skill's
      # deploy-api.md) and the iOS app through EAS, so there is nothing to attach.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_FILE: ${{ steps.changelog.outputs.changelog }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$CHANGELOG_FILE"
