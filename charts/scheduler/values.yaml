image:
  repository: registry.digitalocean.com/freebie/freebie-api
  tag: latest
  pullPolicy: Always

api:
  serviceName: freebie-api
  port: 8080

workerSecret: ""

# Schedules are Pacific wall-clock times all year (CronJob timeZone, Kubernetes
# 1.27+), so they no longer shift an hour when daylight saving time ends.
timeZone: "America/Los_Angeles"

checkTriggers:
  schedule: "0 7,9 * * *"   # 7am + 9am retry; dedupes per game

sendReminders:
  schedule: "0 11,15,17 * * *"  # 11am, 3pm, 5pm
